<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Delete Product</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1 class="title">🗑️ Delete Product</h1>

<div class="table-container">

<table>

    <tr>
        <th>Product ID</th>
        <th>Product Name</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Action</th>
    </tr>

    {% for product in products %}

    <tr>

        <td>{{ product[0] }}</td>

        <td>{{ product[1] }}</td>

        <td>₹{{ product[2] }}</td>

        <td>{{ product[3] }}</td>

        <td>

            <form method="POST"
                  onsubmit="return confirm('Are you sure you want to delete this product?');">

                <input type="hidden"
                       name="pid"
                       value="{{ product[0] }}">

                <button type="submit"
                        style="background:#e53935;">

                    🗑️ Delete

                </button>

            </form>

        </td>

    </tr>

    {% endfor %}

</table>

</div>

<br>

<div style="text-align:center;">

    <a href="/dashboard">
        <button>⬅ Back to Dashboard</button>
    </a>

</div>

</body>
</html>
