<!DOCTYPE html>
<html>
<head>

<title>Reset Password</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-container">

<h2>Create New Password</h2>

<form method="POST">

<div class="password-box">
    <input
    type="password"
    id="new_password"
    name="password"
    placeholder="New Password"
    required>

    <span class="eye" onclick="toggleNew()">👁️</span>
</div>

<button type="submit">
Update Password
</button>

</form>

</div>

<script>
function toggleNew(){
    var x=document.getElementById("new_password");
    x.type=(x.type==="password")?"text":"password";
}

function toggleReset(){
    var x=document.getElementById("reset_confirm");
    x.type=(x.type==="password")?"text":"password";
}
</script>

</body>
</html>
