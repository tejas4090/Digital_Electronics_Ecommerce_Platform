<!DOCTYPE html>
<html>

<head>

<title>Admin Login</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-box">

<h2 align="center">🔐 Admin Login</h2>



<form method="POST">

<input type="text"
name="username"
placeholder="Username"
required>

<div class="password-box">

    <input
    type="password"
    id="admin_password"
    name="password"
    placeholder="Password"
    required>

    

    <span class="eye" onclick="toggleAdminPassword()">👁️</span>

</div>

{% if error %}
<div class="admin-error">
    ❌ {{ error }}
</div>
{% endif %}

<button type="submit">
Login
</button>

</form>

</div>

<script>

function toggleAdminPassword(){

    var x = document.getElementById("admin_password");

    if(x.type === "password"){
        x.type = "text";
    }else{
        x.type = "password";
    }

}

</script>

</body>
</html>
